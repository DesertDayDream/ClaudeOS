<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>AI Bench · your blind vote</title>
<style>
:root{--bg:#14141b;--card:#1c1c26;--line:#2c2c3a;--txt:#e4e4ea;--dim:#8b8b9c;--acc:#6c8cff;--good:#3fb27f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.45 system-ui,Segoe UI,sans-serif}
header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:center;flex-wrap:wrap}
h1{font-size:17px;margin:0}.dim{color:var(--dim);font-size:12px}
.views button,.pick button{background:#262634;color:var(--txt);border:1px solid #3a3a4c;border-radius:6px;padding:6px 12px;font:inherit;cursor:pointer}
.views button.on{border-color:var(--acc);background:#27305a}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:14px 20px}
.col{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.col h2{margin:0;padding:8px 12px;font-size:15px;display:flex;justify-content:space-between;border-bottom:1px solid var(--line)}
.frame{height:calc(100vh - 230px);overflow:auto;background:#fff}
.frame img{display:block;width:100%}.frame.phone img{width:375px;margin:0 auto}
iframe{border:0;width:100%;height:100%;background:#fff}.phone iframe{width:375px;display:block;margin:0 auto}
.pick{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 20px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pick button{font-weight:600;padding:8px 16px}.pick button.on{background:#245c3f;border-color:var(--good)}
textarea{flex:1;min-width:240px;height:38px;background:#101016;color:var(--txt);border:1px solid #3a3a4c;border-radius:6px;padding:6px 8px;font:inherit;resize:vertical}
#out{padding:0 20px 14px;color:var(--dim)}#out b{color:var(--txt)}
details{max-width:700px}summary{cursor:pointer;color:var(--dim);font-size:12px}pre{white-space:pre-wrap;font-size:12px;color:#bbb}
</style></head><body>
<header><a href="/history">? History</a>
  <h1>Which page do you like better?</h1>
  <span class="dim">The apps' names stay hidden until you vote. Your vote replaces the AI judge's opinion of the look.</span>
  <span class="views" id="views">
    <button data-v="site" class="on">Try it live</button><button data-v="desktop">Desktop</button><button data-v="phone">Phone</button><button data-v="states">Error + FAQ</button>
  </span>
  <details><summary>The prompt</summary><pre id="prompt"></pre></details>
</header>
<div class="cols" id="cols"></div>
<div class="pick">
  <button data-s="A">A is better</button><button data-s="tie">About the same</button><button data-s="B">B is better</button><button data-s="bad">Both are bad</button>
  <textarea id="note" placeholder="Why? (optional, saved with your vote)"></textarea>
</div>
<div id="out"></div>
<script>
const rawRun = new URLSearchParams(location.search).get('run');
const run = /^[a-zA-Z0-9-]+$/.test(rawRun || '') ? rawRun : '';
const esc = s => String(s ?? '').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let view = 'site', info = null;
const $ = s => document.querySelector(s);
function draw() {
  $('#cols').innerHTML = ['A', 'B'].map(s => `<div class="col"><h2><span>Page ${s}</span><span class="dim">${info?.revealed ? esc(info.revealed[s]) : ''}</span></h2>
    <div class="frame ${view === 'phone' ? 'phone' : ''}">${view === 'site' ? `<iframe sandbox="allow-scripts allow-forms" src="/site/${run}/${s}/"></iframe>`
      : `<img alt="Page ${s}, ${view}" src="/shot/${run}/${s}/${view}.png" onerror="this.replaceWith(Object.assign(document.createElement('p'),{textContent:'No screenshot.',style:'color:#333;padding:12px'}))">`}</div></div>`).join('');
  document.querySelectorAll('.views button').forEach(b => b.classList.toggle('on', b.dataset.v === view));
  document.querySelectorAll('.pick button').forEach(b => b.classList.toggle('on', info?.vote?.slot === b.dataset.s));
}
const label = s => ({ A: 'A', B: 'B', tie: 'about the same', bad: 'both bad' })[s] || s;
async function load() {
  info = await (await fetch('/api/vote?run=' + encodeURIComponent(run))).json();
  if (info.error) { document.body.innerHTML = `<p style="padding:20px">${esc(info.error)}</p>`; return; }
  $('#prompt').textContent = info.prompt;
  if (info.vote) { $('#note').value = info.vote.note || ''; $('#out').innerHTML = `Your vote: <b>${label(info.vote.slot)}</b>. Pick again to change it.`; }
  draw();
}
document.getElementById('views').onclick = e => { const b = e.target.closest('button'); if (b) { view = b.dataset.v; draw(); } };
document.querySelector('.pick').onclick = async e => {
  const b = e.target.closest('button'); if (!b) return;
  const r = await (await fetch('/api/vote', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ runId: run, slot: b.dataset.s, note: $('#note').value }) })).json();
  if (r.error) { $('#out').textContent = r.error; return; }
  info.vote = { slot: b.dataset.s }; info.revealed = r.revealed;
  const j = r.judge ? ` The ${r.judge.engine === 'codex' ? 'Codex (GPT)' : 'Claude'} judge picked <b>${label(r.judge.slot) || 'nothing'}</b> (${Math.round((r.judge.agreement || 0) * 100)}% of its calls agreed).` : '';
  $('#out').innerHTML = `Saved: <b>${label(b.dataset.s)}</b>. A = ${r.revealed.A}, B = ${r.revealed.B}.${j}<br>Result: ${esc(r.verdict?.why || '')}`;
  draw();
};
load();
</script></body></html>
