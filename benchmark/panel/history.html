<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Benchmark history</title><style>body{margin:20px;background:#13151c;color:#edf0f7;font:13px/1.6 system-ui}h1{font-size:23px}a{color:#96b3ff}.run{background:#1c202b;border:1px solid #33394b;border-radius:8px;padding:16px;margin:14px 0;overflow:auto}pre{white-space:pre-wrap;max-height:130px;overflow:auto;color:#a0a8ba}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:8px;border-bottom:1px solid #33394b}.dim{color:#a0a8ba}</style></head><body><a href="/">← Benchmark</a><h1>History</h1><p class="dim">Reports contain the prompt, settings, final reply, measured usage and captured output text. Review local paths and project content before sharing.</p><div id="list">Loading…</div><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
fetch('/api/history').then(r=>r.json()).then(rows=>{document.getElementById('list').innerHTML=rows.length?rows.map(r=>`<section class="run"><b>${esc(new Date(r.at).toLocaleString())} · ${esc(r.pair)} pair</b><p>${esc(r.gradeError||r.verdict?.why||'No verdict')}</p><pre>${esc(r.prompt)}</pre><table><tr><th>App</th><th>Model / effort</th><th>Elapsed</th><th>Fresh input</th><th>Quality</th></tr>${r.sides.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc([s.model,s.effort].filter(Boolean).join(' / '))}</td><td>${s.elapsedMs==null?'—':(s.elapsedMs/1000).toFixed(1)+'s'}</td><td>${esc(s.tokens?.fresh??'—')}</td><td>${!s.score?'—':!s.score.pass?'FAIL':s.score.parts?.lookBy==='pending'?'Pending':s.score.quality??'Not measured'}</td></tr>`).join('')}</table><p><a href="/benchmark/report?run=${encodeURIComponent(r.runId)}">Export report</a>${r.blind?` · <a href="/benchmark/vote?run=${encodeURIComponent(r.runId)}">${r.vote?'Change vote':'Blind vote'}</a>`:''}</p></section>`).join(''):'No finished rounds yet.';}).catch(e=>{document.getElementById('list').textContent=e.message;});
</script></body></html>
