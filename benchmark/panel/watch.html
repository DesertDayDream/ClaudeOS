<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClaudeOS benchmark</title><style>
:root{color-scheme:dark;--bg:#101019;--card:#1c202b;--line:#33394b;--dim:#a0a8ba;--text:#edf0f7;--accent:#96b3ff;--good:#7fd6a0;--bad:#ff9c9c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px/1.55 system-ui}header{position:sticky;top:0;background:#151a26;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;align-items:center}header b{font-size:15px}.pill{border:1px solid var(--line);border-radius:20px;padding:1px 9px;font-size:12px;color:var(--dim)}.pill.on{color:var(--good);border-color:var(--good)}.pill.bad{color:var(--bad);border-color:var(--bad)}main{padding:12px 16px 40px;max-width:900px;margin:auto}.msg{margin:10px 0;padding:10px 12px;border-radius:9px;background:var(--card);border:1px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere}.msg.user{background:#1d2740}.who{font-size:11px;color:var(--dim);margin-bottom:4px}.tool{font-family:Consolas,monospace;font-size:11.5px;color:var(--dim);margin:2px 0}.dim{color:var(--dim)}
</style></head><body><header><b id="name">Benchmark</b><span class="pill" id="status">…</span><span class="dim" id="run"></span></header><main id="log"><p class="dim">Waiting…</p></main><script>
const $=s=>document.querySelector(s);
const side=new URLSearchParams(location.search).get('side')||'A';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let last='';
async function poll(){
  let v;
  try{const r=await fetch('/api/watch?side='+encodeURIComponent(side));v=await r.json();if(!r.ok)throw new Error(v.error||'Not available');}
  catch(e){$('#status').textContent=e.message;return;}
  document.title=`${v.name} · ClaudeOS benchmark`;$('#name').textContent=v.name;$('#run').textContent=v.runId?`Round ${v.runId}`:'';
  const st=v.failed?'failed':v.waiting?'waiting for its turn':v.busy?'working':v.messages?.length?'finished':'starting';
  $('#status').textContent=v.error||st;$('#status').className='pill'+(v.busy?' on':v.failed?' bad':'');
  const html=(v.messages||[]).map(m=>`<div class="msg ${m.role==='user'?'user':''}"><div class="who">${m.role==='user'?'Prompt':'ClaudeOS'}</div>${(m.tools||[]).map(t=>`<div class="tool">${esc(t.text||t.agent?.text||'')}</div>`).join('')}${esc(m.text||'')}${m.error?`<div class="tool" style="color:var(--bad)">${esc(m.error)}</div>`:''}</div>`).join('')||`<p class="dim">${v.waiting?'This side starts when the other one has finished.':'Starting the chat…'}</p>`;
  if(html!==last){const atEnd=innerHeight+scrollY>=document.body.scrollHeight-40;$('#log').innerHTML=html;last=html;if(atEnd)scrollTo(0,document.body.scrollHeight);}
}
poll();setInterval(poll,1200);
</script></body></html>
