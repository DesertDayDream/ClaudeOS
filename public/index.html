<style>
  :root {
    --bg: #05060d; --panel: rgba(14, 17, 30, 0.78); --line: rgba(160, 175, 255, 0.14);
    --text: #e8eaf6; --dim: #8c93b8; --accent: #d97757;
    --brain: #c9a7ff; --user: #ffc861; --feedback: #ff7aa8; --project: #5fd4ff; --reference: #7dff9e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.45 ui-sans-serif, system-ui, "Segoe UI", sans-serif; overflow: hidden; }
  #scene { position: fixed; inset: 0; }
  .hud { position: fixed; top: 16px; left: 16px; pointer-events: none; }
  .hud h1 { margin: 0; font-size: 20px; letter-spacing: 0.04em; font-weight: 650; }
  .hud h1 span { color: var(--accent); }

  .stats b { display: block; color: var(--text); font-size: 18px; font-variant-numeric: tabular-nums; }
  .legend { display: flex; gap: 12px; margin-top: 10px; color: var(--dim); flex-wrap: wrap; }
  .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; box-shadow: 0 0 8px currentColor; }
  aside { position: fixed; top: 16px; right: 16px; bottom: 16px; width: 380px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 14px; backdrop-filter: blur(12px);
    display: flex; flex-direction: column; overflow: hidden; }
  aside header { display: flex; border-bottom: 1px solid var(--line); }
  aside header button { flex: 1; background: none; border: 0; color: var(--dim); padding: 12px 0; font: inherit; cursor: pointer; }
  aside header button[aria-selected="true"] { color: var(--text); box-shadow: inset 0 -2px 0 var(--accent); }
  .tab { flex: 1; overflow-y: auto; padding: 8px 10px 14px; display: none; }
  .tab.on { display: block; }
  .emp { display: grid; grid-template-columns: 26px 1fr auto; gap: 2px 10px; align-items: center;
    padding: 8px; border-radius: 9px; cursor: pointer; }
  .emp:hover, .emp.sel { background: rgba(255,255,255,0.05); }
  .emp .dot { grid-row: span 2; width: 22px; height: 22px; border-radius: 50%; position: relative; }
  .emp .dot::after { content: ""; position: absolute; inset: 7px 5px auto; height: 4px;

  .emp .who { font-weight: 600; }

  .app svg { width: 11px; height: 11px; }

  .apps-l .row .app { width: 20px; height: 20px; margin: 0; }
  .apps-l .row .app svg { width: 13px; height: 13px; }
  .apps-l .row b { font-weight: 600; }
  .apps-l .row span { display: block; color: var(--dim); font-size: 11px; }
  .apps-l .row em { font-style: normal; font-size: 11px; color: var(--dim); }
  .apps-l .row em.connected { color: #7dff9e; }
  .apps-l .row em.failed, .apps-l .row em.needs { color: #ffb38a; }
  .emp .role { color: var(--dim); font-size: 12px; grid-column: 2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .emp .load { grid-row: span 2; grid-column: 3; text-align: right; color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }
  .emp.busy .load { color: var(--accent); }
  .emp .now { grid-column: 2 / 4; font-size: 11.5px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-left: 14px; position: relative; }
  .emp .now::before, .run .top i { content: ""; position: absolute; left: 0; top: 50%; width: 7px; height: 7px; margin-top: -3.5px; border-radius: 50%; background: var(--st); }
  .emp .now.working { color: var(--text); }

  #detail textarea:focus { border-color: rgba(201,167,255,0.6); }

  #detail input.f { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--line); border-radius: 9px;

  #tip span { color: var(--dim); font-size: 12px; }

  .dialog .actions .msg-err { flex: 1; color: #ff8a8a; font-size: 12px; }
  .dialog .note { color: var(--dim); font-size: 12px; margin-top: 10px; }
  .dialog .note.warn { color: #ffd38a; border: 1px solid rgba(255,200,97,0.4); background: rgba(255,200,97,0.08); border-radius: 9px; padding: 8px 10px; margin: 0 0 6px; }
  .dialog .note a { color: var(--accent); }
  .dialog input::placeholder { color: #5d6385; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #0e111e; border: 1px solid rgba(201,167,255,0.5);
    border-radius: 10px; padding: 10px 14px; z-index: 30; max-width: min(560px, calc(100vw - 32px)); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  .toast span { color: var(--dim); font-size: 12px; display: block; margin-top: 2px; }
  @media (max-width: 760px) {
    aside { top: auto; left: 16px; right: 16px; width: auto; height: 42%; }
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="hud">
  <h1>Claude<span>OS</span></h1>
  <div class="brainbar">
    <button class="brainpick" id="brainBtn" aria-haspopup="true" aria-expanded="false" title="Switch brain">
      <i class="orb"></i><span class="label" id="brainName">Brain</span><span class="caret">▾</span>
    </button>
    <div class="menu" id="brainMenu" hidden></div>
  </div>
  <div class="stats">
    <div><b id="nMem">0</b>memories</div>
    <div><b id="nEmp">0</b>employees</div>
    <div><b id="nBusy">0</b>working</div>
  </div>
  <div class="legend">
    <span><i style="color:var(--brain);background:var(--brain)"></i>shared brain</span>
    <span><i style="color:var(--user);background:var(--user)"></i>user</span>
    <span><i style="color:var(--feedback);background:var(--feedback)"></i>feedback</span>
    <span><i style="color:var(--project);background:var(--project)"></i>project</span>
    <span><i style="color:var(--reference);background:var(--reference)"></i>reference</span>
  </div>
</div>
<aside>
  <header>
    <button data-tab="chat" aria-selected="true">Chat</button>
    <button data-tab="memory" aria-selected="false">Memory</button>
    <button data-tab="team" aria-selected="false">Team</button>
    <button data-tab="feed" aria-selected="false">Activity</button>
  </header>
  <div class="tab on" id="chat">
    <div id="log"></div>
    <form class="composer" id="composer">
      <div class="nudge" id="nudge" hidden></div>
      <div class="meter" id="meter" hidden></div>
      <textarea id="input" rows="2" placeholder="Ask Claude anything… e.g. “Write a 45-second script about my island”"></textarea>
      <div class="row">
        <span class="hint">Enter to send · Shift+Enter for a new line</span>
        <button type="button" class="btn" id="wrapChat" title="Save what matters to the brain's memory, then start a fresh, cheaper chat that gets a short handover">Wrap up</button>
        <button type="button" class="btn" id="newChat" title="Start a fresh conversation">New chat</button>
        <button type="button" class="btn" id="stop" hidden>Stop</button>
        <button type="submit" class="btn primary" id="send">Send</button>
      </div>
    </form>
  </div>
  <div class="tab" id="memory">
    <div class="search"><input type="search" id="memSearch" placeholder="Search memories…" autocomplete="off" spellcheck="false"></div>
    <div id="memList"></div>
  </div>
  <div class="tab" id="team"></div>
  <div class="tab feed" id="feed"></div>
  <div id="detail"></div>
</aside>
<div id="tip"></div>
<div id="conn">connecting…</div>
<script>window.CLAUDEOS_TOKEN = "__CLAUDEOS_TOKEN__";</script>
<script type="module" src="/app.js"></script>
<script type="module" src="/chat.js"></script>
<script type="module" src="/brains.js"></script>
</body>
</html>
