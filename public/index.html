  .menu .item .pt { grid-column: 2; color: var(--dim); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .menu .item .rm { grid-row: span 2; grid-column: 3; background: none; border: 0; color: var(--dim); cursor: pointer; font-size: 15px; padding: 2px 6px; border-radius: 6px; }
  .menu .item .rm:hover { color: #ff8a8a; background: rgba(255,255,255,0.06); }
  .menu hr { border: 0; border-top: 1px solid var(--line); margin: 6px 4px; }
  .menu .act { display: block; width: 100%; text-align: left; background: none; border: 0; color: var(--text); font: inherit; padding: 8px; border-radius: 8px; cursor: pointer; }
  .menu .act:hover { background: rgba(255,255,255,0.06); }
  .menu .act span { color: var(--dim); font-size: 12px; display: block; }
  .modal { position: fixed; inset: 0; background: rgba(3,4,10,0.6); display: grid; place-items: center; z-index: 20; padding: 16px; }
  .dialog { width: min(520px, 100%); max-height: calc(100vh - 32px); overflow: auto; background: #0e111e; border: 1px solid var(--line);
    border-radius: 14px; padding: 18px; box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
  .dialog h2 { margin: 0 0 4px; font-size: 17px; }
  .dialog .sub { color: var(--dim); margin: 0 0 14px; }
  .dialog label { display: block; color: var(--dim); font-size: 12px; margin: 12px 0 5px; }
  .dialog input[type=text] { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--line); border-radius: 9px;
    color: var(--text); font: inherit; padding: 8px 10px; outline: none; }
  .dialog input[type=text]:focus { border-color: rgba(201,167,255,0.6); }
  .dialog .choice { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; margin-bottom: 8px; cursor: pointer; }
  .dialog .choice:has(input:checked) { border-color: rgba(201,167,255,0.6); background: rgba(201,167,255,0.06); }
  .dialog .choice input { margin-top: 3px; }
  .choice b { display: block; }
  .choice span { color: var(--dim); font-size: 12px; }
  .browser { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .browser .where { display: flex; gap: 6px; align-items: center; padding: 7px 8px; border-bottom: 1px solid var(--line); background: rgba(0,0,0,0.25); }
  .browser .where code { flex: 1; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
  .browser .list { max-height: 220px; overflow-y: auto; padding: 4px; }
  .browser .f { padding: 6px 8px; border-radius: 7px; cursor: pointer; display: flex; gap: 8px; align-items: center; }
  .browser .f:hover { background: rgba(255,255,255,0.06); }
  .browser .f::before { content: ""; width: 14px; height: 11px; border-radius: 2px; background: rgba(160,175,255,0.35); flex: none; }
  .browser .none { color: var(--dim); padding: 10px; font-size: 12px; }
  .dialog .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; align-items: center; }
  .dialog .actions .msg-err { flex: 1; color: #ff8a8a; font-size: 12px; }
  .dialog .note { color: var(--dim); font-size: 12px; margin-top: 10px; }
  .dialog .note.warn { color: #ffd38a; border: 1px solid rgba(255,200,97,0.4); background: rgba(255,200,97,0.08); border-radius: 9px; padding: 8px 10px; margin: 0 0 6px; }
  .dialog .note a { color: var(--accent); }
  .dialog input::placeholder { color: #5d6385; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #0e111e; border: 1px solid rgba(201,167,255,0.5);
    border-radius: 10px; padding: 10px 14px; z-index: 30; max-width: min(560px, calc(100vw - 32px)); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  .toast span { color: var(--dim); font-size: 12px; display: block; margin-top: 2px; }
  @media (max-width: 760px) {
    aside { top: auto; left: 16px; right: 16px; width: auto; height: 42%; }
  }
  /* the Git tab */
  .ghead { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
  .grepo { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .grepo b { font-size: 13.5px; }
  .grepo span, .gwt-p { color: var(--dim); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
  .gbranch { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding: 7px 9px; border: 1px solid var(--line); border-radius: 9px; background: rgba(255,255,255,0.03); }
  .gbr { font-weight: 600; font-size: 12.5px; }
  .gico { width: 12px; height: 12px; vertical-align: -1px; margin-right: 4px; color: var(--dim); }
  .gsync { flex: 1; color: var(--dim); font-size: 11.5px; }
  .glast { color: var(--dim); font-size: 11px; margin: 5px 2px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gsec { margin-top: 12px; }
  .gsec-h { display: flex; align-items: center; gap: 6px; }
  .gfold { flex: 1; text-align: left; background: none; border: 0; color: var(--dim); font: inherit; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; cursor: pointer; padding: 2px 0; }
  .gfold em { font-style: normal; background: rgba(255,255,255,0.08); border-radius: 8px; padding: 0 6px; margin-left: 3px; letter-spacing: 0; }
  .gsec.folded .gsec-b { display: none; }
  .gsec-b { margin-top: 5px; }
  .gnone { color: var(--dim); font-size: 12px; padding: 4px 2px; }
  .gmore { color: var(--dim); font-size: 11.5px; padding: 4px; }
  .gfile { display: flex; align-items: center; gap: 6px; border-radius: 6px; }
  .gfile:hover, .gfile.open { background: rgba(255,255,255,0.04); }
  .gfile button { flex: 1; min-width: 0; display: flex; gap: 7px; align-items: center; background: none; border: 0; color: var(--text); font: 12px ui-monospace, Consolas, monospace; padding: 3px 4px; cursor: pointer; text-align: left; }
  .gfile button span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
  .gfile a { color: var(--dim); font-size: 11px; padding-right: 6px; text-decoration: none; }
  .gfile a:hover { color: var(--text); }
  .gfile .k { font-style: normal; width: 14px; text-align: center; font-weight: 700; color: #ffc861; flex: none; }
  .gfile .kA, .gfile .kN, .gfile .k\? { color: #5fd47a; } .gfile .kD { color: #ff6b81; } .gfile .kU { color: #ff6b81; } .gfile .kR { color: #6ea8ff; }
  .gwt { border: 1px solid var(--line); border-radius: 9px; padding: 7px 9px; margin-bottom: 6px; }
  .gwt.here { border-color: rgba(217,119,87,0.55); }
  .gwt-t { display: flex; gap: 6px; align-items: center; font-size: 12.5px; }
  .gacts { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
  .gtag { font-size: 10.5px; border: 1px solid var(--line); border-radius: 8px; padding: 0 6px; color: var(--dim); }
  .gtag.ok { color: #7be0a0; border-color: rgba(95,212,122,0.4); } .gtag.bad { color: #ff9aa8; border-color: rgba(255,107,129,0.4); }
  .gnew { display: flex; gap: 6px; }
  .gnew input { flex: 1; min-width: 0; background: rgba(0,0,0,0.3); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; font: 12px ui-monospace, Consolas, monospace; outline: none; }
  .gpr { border: 1px solid var(--line); border-radius: 9px; padding: 7px 9px; margin-bottom: 6px; }
  .gpr.cur { border-color: rgba(217,119,87,0.55); }
  .gpr-t a, .grun a { color: var(--text); text-decoration: none; font-size: 12.5px; font-weight: 600; }
  .gpr-t a:hover, .grun a:hover, .gck a:hover { text-decoration: underline; }
  .gpr-m { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; color: var(--dim); font-size: 11px; margin-top: 4px; }
  .gpr-m .btn { margin-left: auto; }
  .gchk { font-size: 11px; } .gchk.pass { color: #7be0a0; } .gchk.fail { color: #ff9aa8; } .gchk.pending { color: #ffc861; } .gchk.none { color: var(--dim); }
  .gchecks { margin-top: 6px; border-top: 1px solid var(--line); padding-top: 5px; }
  .gck { display: flex; gap: 6px; align-items: baseline; font-size: 11.5px; padding: 1px 0; }
  .gck a { color: var(--text); text-decoration: none; } .gck span { color: var(--dim); font-size: 10.5px; }
  .gck i, .grun > i { font-style: normal; width: 12px; text-align: center; flex: none; }
  .pass > i { color: #5fd47a; } .fail > i { color: #ff6b81; } .pending > i { color: #ffc861; } .skip > i { color: var(--dim); }
  .grun { display: flex; gap: 7px; align-items: center; padding: 5px 2px; border-bottom: 1px solid rgba(255,255,255,0.04); }
  .grun > div { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .grun > div span { color: var(--dim); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #git .diff { margin: 2px 0 6px 4px; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="hud">
  <h1>Claude<span>OS</span></h1>
  <div class="brainbar">
    <button class="brainpick" id="brainBtn" aria-haspopup="true" aria-expanded="false" title="Switch brain">
      <i class="orb"></i><span class="label" id="brainName">Brain</span><span class="caret">▾</span>
    </button>
    <div class="menu" id="brainMenu" hidden></div>
    <button class="brainpick gear" id="settingsBtn" title="Settings: own window, hotkey, notifications, updates and rollback, start with Windows">⚙</button>
    <div id="settingsMenu" hidden></div>
  </div>
  <div class="stats">
    <div><b id="nMem">0</b>memories</div>
    <div><b id="nEmp">0</b>employees</div>
    <div><b id="nBusy">0</b>working</div>
  </div>
  <div class="legend">
    <span><i style="color:var(--brain);background:var(--brain)"></i>shared brain</span>
    <span><i style="color:var(--user);background:var(--user)"></i>user</span>
    <span><i style="color:var(--feedback);background:var(--feedback)"></i>feedback</span>
    <span><i style="color:var(--project);background:var(--project)"></i>project</span>
    <span><i style="color:var(--reference);background:var(--reference)"></i>reference</span>
  </div>
</div>
<aside>
  <div id="asideGrip" title="Drag to make the panel wider (double-click: back to normal)"></div>
  <header>
    <button data-tab="chat" aria-selected="true">Chat</button>
    <button data-tab="memory" aria-selected="false">Memory</button>
    <button data-tab="team" aria-selected="false">Team</button>
    <button data-tab="feed" aria-selected="false">Activity</button>
    <button data-tab="term" aria-selected="false" title="Terminals you and Claude share">Terminal</button>
    <button data-tab="git" aria-selected="false" title="Branch, changes, worktrees, pull requests and CI of the chat's repository">Git</button>
    <button data-tab="arts" aria-selected="false" title="Pages Claude published">Artifacts</button>
  </header>
  <div class="tab on" id="chat">
    <div class="chatbar">
      <button type="button" class="btn mini" id="chatsBtn" title="Your chats in this brain: open, search, rename, delete">Chats</button>
      <span class="dot" id="chatsDot" title="Another chat is working"></span>
      <b id="chatTitle" title="Double-click to rename">New chat</b>
      <button type="button" class="btn mini" id="chatTools" title="Browser, Claude in Chrome and computer use for this chat">Tools</button>
      <div id="toolsMenu" hidden>
        <label><input type="checkbox" data-tool="browser"> <b>Browser</b><span>Claude's own Chromium window you can watch, with its own sign-ins (Playwright; needs Node's npx)</span></label>
        <label><input type="checkbox" data-tool="chrome"> <b>Claude in Chrome</b><span>Your real Chrome with your sign-ins (needs the Claude in Chrome extension)</span></label>
        <label><input type="checkbox" data-tool="computer"> <b>Computer use</b><span>Claude can take screenshots and use the mouse and keyboard on this PC</span></label>
      </div>
      <button type="button" class="btn mini folder" id="chatFolder" title="The folder this chat works in. Pick a project folder (like UEFN Coding) before the first message to work there the way Claude Desktop does: its CLAUDE.md, settings, MCP servers and Claude Code memory.">Brain folder</button>
    </div>
    <div id="chatList" hidden>
      <input type="search" id="chatSearch" placeholder="Search your chats…" autocomplete="off" spellcheck="false">
      <div id="chatRows"></div>
    </div>
    <div id="log"></div>
    <form class="composer" id="composer">
      <div class="nudge" id="nudge" hidden></div>
      <div class="meter" id="meter" hidden></div>
      <div id="queue" hidden></div>
      <div class="attach" id="attach"></div>
      <textarea id="input" rows="2" placeholder="Ask the Manager anything… e.g. “Write a 45-second script about my island”"></textarea>
      <div class="row">
        <span class="hint pick" title="Model and effort for the Manager's next replies in this brain. Switching model mid-chat re-reads the whole chat once (no cache).">
          <select id="chatModel" aria-label="Model"><option value="">Default model</option><option value="fable">Fable</option><option value="opus">Opus</option><option value="sonnet">Sonnet</option><option value="haiku">Haiku</option></select>
          <select id="chatEffort" aria-label="Effort"><option value="">Default effort</option><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option><option value="xhigh">Extra high</option><option value="max">Max</option></select>
          <select id="chatMode" aria-label="Permissions" title="How much Claude asks before acting in this chat. Ask first: anything not already allowed shows an Allow/Deny card. Accept edits: file edits go ahead. Auto: Claude Code decides what's safe and asks only for risky steps. Plan only: Claude plans and changes nothing. Don't ask: everything goes ahead."><option value="">Ask first</option><option value="acceptEdits">Accept edits</option><option value="auto">Auto</option><option value="plan">Plan only</option><option value="bypassPermissions">Don't ask</option></select>
        </span>
        <label class="btn" id="attachBtn" title="Attach files or images (you can also paste a screenshot or drop files on the chat)">📎<input type="file" id="attachFiles" multiple hidden></label>
        <button type="button" class="btn" id="wrapChat" title="Save what matters to the brain's memory, then start a fresh, cheaper chat that gets a short handover">Wrap up</button>
        <button type="button" class="btn" id="newChat" title="Start a fresh conversation">New chat</button>
        <button type="button" class="btn" id="stop" hidden>Stop</button>
        <button type="button" class="btn" id="queueBtn" title="Save this request for the team without sending it yet. Queue several, then press Send to team: the Manager briefs them all at once and splits the work.">Queue</button>
        <button type="submit" class="btn primary" id="send" title="Enter to send · Shift+Enter for a new line">Send</button>
      </div>
    </form>
  </div>
  <div class="tab" id="memory">
    <div class="search"><input type="search" id="memSearch" placeholder="Search memories…" autocomplete="off" spellcheck="false"></div>
    <div id="memList"></div>
  </div>
  <div class="tab" id="team"><div id="teamList"></div></div>
  <div class="tab feed" id="feed"><div id="briefs"></div><div class="runs-h" id="feedHead">Log</div><div id="feedList"></div></div>
  <div class="tab" id="term">
    <div class="termbar"><div id="termTabs"></div><button type="button" class="btn mini" id="termStop" title="Ctrl+C for what is running (it's ended if it doesn't stop)" disabled>Stop</button><button type="button" class="btn mini" id="termNew" title="A new terminal in this chat's folder">+</button></div>
    <div id="termScreens"></div>
  </div>
  <div class="tab" id="git"></div>
  <div class="tab" id="arts"></div>
  <div id="detail"></div>
</aside>
<section id="preview" hidden>
  <div class="pv-head">
    <b id="pvName">Preview</b>
    <button type="button" class="btn mini" data-pv-act="reload" title="Load it again">Reload</button>
    <button type="button" class="btn mini" data-pv-act="editor" title="Open the file in your editor">Editor</button>
    <button type="button" class="btn mini" data-pv-act="close" title="Close (Esc)">✕</button>
  </div>
  <div id="pvBody"></div>
</section>
<div id="tip"></div>
<div id="conn">connecting…</div>
<script>window.CLAUDEOS_TOKEN = "__CLAUDEOS_TOKEN__";</script>
<script type="module" src="/app.js"></script>
<script type="module" src="/chat.js"></script>
<script type="module" src="/queue.js"></script>
<script type="module" src="/brains.js"></script>
<script type="module" src="/desk.js"></script>
<script type="module" src="/git.js"></script>
<script type="module" src="/settings.js"></script>
</body>
</html>
